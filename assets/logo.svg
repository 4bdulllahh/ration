<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="t">
  <title id="t">Ration logo: an ink doodle of a knife cutting a slice of bread so thin you can see through it</title>
  <defs>
    <!-- wobbles the lines so they look drawn by hand with a brush pen -->
    <filter id="ink" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency=".022" numOctaves="2" seed="11" result="slow"/>
      <feDisplacementMap in="SourceGraphic" in2="slow" scale="13" result="wobbly"/>
      <feTurbulence type="fractalNoise" baseFrequency=".11" numOctaves="1" seed="3" result="grit"/>
      <feDisplacementMap in="wobbly" in2="grit" scale="5"/>
    </filter>
  </defs>

  <rect width="512" height="512" rx="96" fill="#fff"/>

  <g filter="url(#ink)" fill="#fff" stroke="#000" stroke-width="11" stroke-linecap="round" stroke-linejoin="round">
    <!-- plate -->
    <ellipse cx="256" cy="418" rx="212" ry="42"/>
    <path d="M118 420 C170 440 330 442 398 420" fill="none" stroke-width="7"/>

    <!-- loaf: side, then the cut face -->
    <path d="M172 198 L142 184 C140 120 190 80 240 84 C292 82 330 112 340 150 L354 198 Z"/>
    <path d="M142 184 C138 260 140 330 144 398 L172 410 V198 Z"/>
    <path d="M172 410 C168 340 170 262 172 198 C172 126 216 96 264 96 C316 96 356 126 354 198 C356 270 356 342 352 410 Z"/>

    <!-- gloved hand on top of the loaf -->
    <path d="M170 40 C152 74 172 106 200 116 C210 136 230 138 240 122 C250 140 274 140 284 122
             C296 138 318 134 324 114 C358 100 370 70 354 40 Z"/>
    <path d="M240 122 C238 106 240 94 246 84 M284 122 C284 106 284 94 280 84" fill="none" stroke-width="8"/>
    <path d="M234 46 V68 M262 44 V70 M290 46 V68" fill="none" stroke-width="8"/>
    <rect x="156" y="-16" width="212" height="56" rx="26"/>

    <!-- knife: blade, solid handle, gloved hand -->
    <path d="M40 330 C96 320 150 302 214 286 L446 232 L456 280 L262 332 C176 356 96 364 40 330 Z"/>
    <path d="M92 330 C140 320 186 306 232 294" fill="none" stroke-width="6"/>
    <path d="M444 226 L530 206 L540 262 L456 284 Z" fill="#000"/>
    <path d="M470 196 C484 174 522 172 544 190 V282 C524 300 490 298 474 278 C460 254 458 220 470 196 Z"/>
    <path d="M474 228 C488 222 502 222 514 228 M476 254 C490 248 504 248 516 254" fill="none" stroke-width="7"/>

    <!-- the slice: outline only, so the loaf and the knife show through it -->
    <path d="M234 150 C286 124 354 134 388 172 C398 234 394 302 402 358 C408 400 394 432 352 442
             C308 452 248 450 216 436 C194 426 198 404 216 396 C206 368 242 354 246 332
             C250 306 270 288 264 264 C248 260 226 252 224 230 C222 202 226 174 234 150 Z"
          fill="none" stroke-width="8"/>
    <path d="M216 396 C258 414 332 414 394 394 M212 416 C260 430 336 430 400 412 M228 432 C272 442 332 442 374 432"
          fill="none" stroke-width="6"/>
  </g>

  <!-- ink spatter -->
  <g fill="#000" filter="url(#ink)">
    <circle cx="74" cy="92" r="6"/><circle cx="96" cy="118" r="3"/><circle cx="60" cy="140" r="2.5"/>
    <ellipse cx="108" cy="70" rx="7" ry="3" transform="rotate(-30 108 70)"/>
    <circle cx="418" cy="96" r="5"/><circle cx="440" cy="124" r="2.5"/><circle cx="402" cy="62" r="3"/>
    <ellipse cx="452" cy="80" rx="6" ry="2.5" transform="rotate(40 452 80)"/>
    <circle cx="66" cy="250" r="3.5"/><circle cx="92" cy="272" r="2"/><circle cx="52" cy="392" r="4"/>
    <circle cx="462" cy="352" r="4.5"/><circle cx="478" cy="378" r="2.5"/><circle cx="446" cy="330" r="2"/>
    <circle cx="120" cy="472" r="3.5"/><circle cx="300" cy="480" r="2.5"/><circle cx="392" cy="474" r="4"/>
    <ellipse cx="206" cy="484" rx="6" ry="2.5" transform="rotate(-15 206 484)"/>
    <circle cx="296" cy="250" r="2.5"/><circle cx="318" cy="226" r="2"/><circle cx="204" cy="330" r="2.5"/>
    <circle cx="330" cy="360" r="2"/>
  </g>
</svg>
