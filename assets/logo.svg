<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="t">
  <title id="t">Ration logo: a knife cutting a slice of bread so thin you can see through it</title>
  <rect width="512" height="512" rx="96" fill="#2a1511"/>
  <ellipse cx="256" cy="268" rx="230" ry="210" fill="#3a1d15"/>

  <!-- plate -->
  <ellipse cx="256" cy="414" rx="206" ry="46" fill="#15181c"/>
  <ellipse cx="256" cy="406" rx="206" ry="46" fill="#23272d" stroke="#3d434b" stroke-width="4"/>
  <ellipse cx="256" cy="404" rx="150" ry="28" fill="#1a1d22"/>

  <!-- loaf -->
  <path d="M168 398 V196 C168 132 214 104 262 104 C310 104 352 132 352 196 V398 Z"
        fill="#c8853f" stroke="#4a2412" stroke-width="7" stroke-linejoin="round"/>
  <path d="M168 196 C168 132 214 104 262 104 C310 104 352 132 352 196 C352 214 336 222 322 212 C300 150 220 150 198 212 C184 222 168 214 168 196 Z"
        fill="#9a5a24"/>
  <path d="M190 240 V380" stroke="#dba05a" stroke-width="10" stroke-linecap="round" opacity=".55"/>

  <!-- knife -->
  <g stroke-linejoin="round">
    <path d="M56 338 C92 300 150 286 214 280 L418 248 L426 292 L196 346 C140 358 88 358 56 338 Z"
          fill="#93a7b0" stroke="#27343a" stroke-width="6"/>
    <path d="M84 334 C124 310 170 302 218 296 L404 266" fill="none" stroke="#d3dfe4" stroke-width="5" stroke-linecap="round" opacity=".8"/>
    <rect x="414" y="238" width="96" height="58" rx="18" transform="rotate(-9 414 267)"
          fill="#4a2a1c" stroke="#1d0f0a" stroke-width="6"/>
  </g>

  <!-- the see-through slice, drawn over the knife on purpose -->
  <path d="M236 150 C282 128 344 138 372 176 C384 232 380 300 386 356 C390 392 372 420 330 426
           C290 432 244 432 222 420 C204 410 210 388 226 380 C214 352 232 330 222 300
           C214 262 216 196 236 150 Z"
        fill="#f0b262" fill-opacity=".5" stroke="#5c2f15" stroke-width="5" stroke-linejoin="round"/>
  <path d="M226 380 C262 396 318 396 356 380" fill="none" stroke="#5c2f15" stroke-width="4" stroke-linecap="round" opacity=".7"/>
  <path d="M232 404 C270 414 318 414 352 402" fill="none" stroke="#5c2f15" stroke-width="4" stroke-linecap="round" opacity=".5"/>
</svg>
