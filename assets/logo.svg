<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="t">
  <title id="t">Ration logo: a knife cutting a slice of bread so thin you can see through it</title>
  <defs>
    <clipPath id="frame"><rect width="512" height="512" rx="96"/></clipPath>
    <radialGradient id="room" cx="42%" cy="40%" r="75%">
      <stop offset="0" stop-color="#6a3320"/>
      <stop offset=".55" stop-color="#3a1a12"/>
      <stop offset="1" stop-color="#170a08"/>
    </radialGradient>
    <radialGradient id="shade" cx="50%" cy="48%" r="62%">
      <stop offset=".55" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity=".6"/>
    </radialGradient>
    <linearGradient id="bread" x1="0" x2="1">
      <stop offset="0" stop-color="#8f5526"/>
      <stop offset=".35" stop-color="#bd7c3c"/>
      <stop offset="1" stop-color="#a96a30"/>
    </linearGradient>
    <linearGradient id="steel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#aab9bb"/>
      <stop offset="1" stop-color="#5f7378"/>
    </linearGradient>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="512" height="512" fill="url(#room)"/>

    <!-- table and plate -->
    <path d="M0 408 H512 V512 H0 Z" fill="#1c0e0a"/>
    <ellipse cx="250" cy="428" rx="222" ry="44" fill="#121416"/>
    <ellipse cx="250" cy="420" rx="222" ry="44" fill="#2c2f33" stroke="#4a4f55" stroke-width="3"/>
    <ellipse cx="250" cy="418" rx="168" ry="27" fill="#1b1d20"/>

    <!-- loaf -->
    <path d="M166 408 V196 C166 124 212 92 262 92 C314 92 354 124 354 196 V408 Z"
          fill="url(#bread)" stroke="#33170b" stroke-width="6" stroke-linejoin="round"/>
    <path d="M166 196 C166 124 212 92 262 92 C314 92 354 124 354 196 C340 150 300 132 262 132 C222 132 182 150 166 196 Z"
          fill="#7c4519" opacity=".85"/>

    <!-- hand resting on the loaf -->
    <path d="M150 -10 C150 50 168 96 196 112 C206 132 226 134 236 118 C246 136 270 136 280 118
             C292 134 314 130 320 110 C352 92 372 46 370 -10 Z"
          fill="#b9a091" stroke="#3a2018" stroke-width="5" stroke-linejoin="round"/>
    <path d="M236 118 C234 100 236 86 242 74 M280 118 C280 100 280 86 276 74"
          fill="none" stroke="#3a2018" stroke-width="4" stroke-linecap="round" opacity=".7"/>

    <!-- knife, coming in from the right -->
    <path d="M44 326 C96 318 150 300 214 284 L452 228 L462 276 L262 330 C176 354 96 362 44 326 Z"
          fill="url(#steel)" stroke="#1b2428" stroke-width="5" stroke-linejoin="round"/>
    <path d="M78 326 C128 316 176 302 226 290 L440 240" fill="none" stroke="#dfe8e8" stroke-width="4"
          stroke-linecap="round" opacity=".55"/>
    <path d="M448 222 L530 204 L540 258 L460 280 Z" fill="#2a1711" stroke="#120806" stroke-width="5" stroke-linejoin="round"/>
    <path d="M470 196 C492 180 530 184 540 204 L540 262 C524 288 492 290 474 272 C462 250 460 216 470 196 Z"
          fill="#b9a091" stroke="#3a2018" stroke-width="5" stroke-linejoin="round"/>

    <!-- the see-through slice, drawn over the knife on purpose -->
    <path d="M232 146 C284 120 352 130 386 168 C396 230 392 300 400 356 C406 398 392 430 350 440
             C306 450 246 448 214 434 C192 424 196 402 214 394 C204 366 240 352 244 330
             C248 304 268 286 262 262 C246 258 224 250 222 228 C220 200 224 170 232 146 Z"
          fill="#f2b76c" fill-opacity=".42" stroke="#3d1c0e" stroke-width="4" stroke-linejoin="round"/>
    <path d="M214 394 C256 412 330 412 392 392" fill="none" stroke="#3d1c0e" stroke-width="3.5" stroke-linecap="round" opacity=".75"/>
    <path d="M210 414 C258 428 334 428 398 410" fill="none" stroke="#3d1c0e" stroke-width="3.5" stroke-linecap="round" opacity=".55"/>
    <path d="M226 430 C270 440 330 440 372 430" fill="none" stroke="#3d1c0e" stroke-width="3" stroke-linecap="round" opacity=".4"/>

    <rect width="512" height="512" fill="url(#shade)"/>
  </g>
</svg>
