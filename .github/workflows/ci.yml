name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  hook:
    name: Hook tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - run: sh tests/hook.test.sh

  files:
    name: Plugin files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: JSON files are valid
        run: jq empty .claude-plugin/plugin.json .claude-plugin/marketplace.json hooks/hooks.json
      - name: Skill and helpers have a name and description
        run: |
          for f in skills/ration/SKILL.md agents/*.md; do
            head -n 1 "$f" | grep -qx -- '---' || { echo "$f: no frontmatter"; exit 1; }
            grep -q '^name: ' "$f" || { echo "$f: no name"; exit 1; }
            grep -q '^description: ' "$f" || { echo "$f: no description"; exit 1; }
          done
      - name: Helpers have a locked model
        run: |
          for f in agents/*.md; do
            grep -Eq '^model: (haiku|sonnet|opus)$' "$f" || { echo "$f: no locked model"; exit 1; }
          done
      - name: No long dashes or ellipsis characters
        run: |
          if grep -rnP '[\x{2014}\x{2013}\x{2026}]' --include='*.md' --include='*.json' --include='*.sh' --include='*.yml' --include='*.svg' .; then
            echo "Use commas, colons, full stops or three plain dots instead."; exit 1
          fi
